services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    networks:
      - datarecipes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - datarecipes

networks:
  datarecipes:
    driver: bridge
