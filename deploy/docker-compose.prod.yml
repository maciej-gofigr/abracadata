# Prod stack for a single EC2 box. Images are built in CI and pulled from GHCR;
# the box only runs `docker compose pull && up -d`. Bedrock creds come from the
# EC2 instance role (no keys on the box) — see docs/DEPLOY.md.
#
# Deploy from /opt/prestidata with this file + a .env (see deploy/.env.example).
#
# Memory caps (mem_limit) exist because on 2026-09-09 an unbounded backend grew
# to 1.45 GB, and the host OOM killer — which picks its victim by heuristic, not
# by whose fault it is — took the box down with it, including sshd/SSM. Capped,
# a runaway backend hits its own limit and only that container dies. The limits
# sum to ~2.8 GB of the 4 GB box, leaving headroom for the kernel, dockerd and
# the SSM agent. memswap_limit == mem_limit denies containers swap: swap is a
# safety margin for the host, not a way for a leaking process to keep growing.

services:
  web:
    image: ${IMAGE_REPO}/prestidata-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    depends_on: [backend]
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Unset/blank DOMAIN -> ":80" -> plain HTTP on the box's IP (no cert),
      # for smoke-testing before DNS. A real hostname -> Caddy auto-HTTPS.
      DOMAIN: ${DOMAIN:-:80}
      # Canonical bare domain; when set, www.<APEX> 301-redirects to it.
      APEX: ${APEX:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - caddy_data:/data      # persisted TLS certs
      - caddy_config:/config
    networks: [app]

  backend:
    image: ${IMAGE_REPO}/prestidata-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 1536m
    memswap_limit: 1536m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Python block-buffers stdout when it is not a TTY, and uvicorn writes its
      # ACCESS log to stdout (only the error log goes to stderr). During the
      # 2026-09-09 outage that meant every access line sat unflushed in a 4 KB
      # buffer and was lost with the process — the logs needed to identify what
      # exhausted memory never reached disk. Unbuffered, they do.
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      BEDROCK_MODEL: ${BEDROCK_MODEL:-global.anthropic.claude-sonnet-4-6}
      SUGGEST_MODEL: ${SUGGEST_MODEL:-global.anthropic.claude-haiku-4-5-20251001-v1:0}
      # Sign-in emails via SES (unset -> codes are logged, not emailed).
      MAIL_FROM: ${MAIL_FROM:-}
      APP_NAME: ${APP_NAME:-Abracadata}
      # Starting daily AI spend ceiling; the admin page overrides it at runtime.
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-50}
      # AUTH_DEV_ECHO and MOCK_GENERATE intentionally UNSET (off) in prod.
    networks: [app]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1024m
    memswap_limit: 1024m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [app]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  app:
