name: build-and-push

# Test, then build the web + backend images and push them to GHCR. The EC2 box
# then pulls them (docs/DEPLOY.md). No SSH/deploy keys in CI for the POC.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Gate: nothing is published unless the suites pass. Notably this runs the
  # migration-drift check, so a model change without a matching Alembic
  # revision can't reach production (where the schema only moves via
  # migrations) and break it at runtime.
  test:
    runs-on: ubuntu-latest
    services:
      # Prod runs Postgres. Migrations are also checked against it because
      # sqlite is more permissive: an autogenerated `server_default=text('0')`
      # for a boolean applies fine on sqlite and is rejected by Postgres.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Backend tests (incl. migrations in sync with models)
        working-directory: backend
        run: python -m pytest -q

      - name: Migrations apply cleanly on Postgres (the engine prod uses)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
        run: |
          python -m app.migrate          # fresh database
          python -m app.migrate          # re-run must be a no-op

      - name: Migrations adopt a pre-Alembic database (production's case)
        working-directory: backend
        env:
          PGPASSWORD: ci
        run: |
          psql -h localhost -U ci -d ci -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          # Recreate the shape create_all used to build, then adopt it.
          psql -h localhost -U ci -d ci -c "CREATE TABLE users (
            id varchar(32) PRIMARY KEY,
            email varchar(320) UNIQUE,
            created_at timestamp NOT NULL DEFAULT now());"
          psql -h localhost -U ci -d ci -c "INSERT INTO users (id, email) VALUES ('u1','pre@example.com');"
          DATABASE_URL=postgresql+psycopg://ci:ci@localhost:5432/ci python -m app.migrate
          psql -h localhost -U ci -d ci -c 'SELECT email, is_admin FROM users;' | grep -q pre@example.com

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Frontend type-check + build
        working-directory: frontend
        run: npm run build

  images:
    needs: test
    # Only publish from main; PRs stop after the test gate.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          build-args: |
            VITE_GA_MEASUREMENT_ID=${{ vars.GA_MEASUREMENT_ID }}
            VITE_ADS_CONVERSION_ID=${{ vars.ADS_CONVERSION_ID }}
            VITE_ADS_LABEL_SAVE_RECIPE=${{ vars.ADS_LABEL_SAVE_RECIPE }}
            VITE_ADS_LABEL_SIGN_UP=${{ vars.ADS_LABEL_SIGN_UP }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/prestidata-web:latest
            ghcr.io/${{ github.repository_owner }}/prestidata-web:${{ github.sha }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/prestidata-backend:latest
            ghcr.io/${{ github.repository_owner }}/prestidata-backend:${{ github.sha }}
